<!doctype html>
<!-- paritas coming-soon page. The name is always lowercase (see brief rule 0). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>paritas</title>
  <meta name="description" content="Working capital on equal terms." />

  <!-- open graph -->
  <meta property="og:title" content="paritas" />
  <meta property="og:description" content="Working capital on equal terms." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://paritas.finance/" />
  <meta property="og:image" content="https://paritas.finance/assets/paritas-icon-1000.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="paritas" />
  <meta name="twitter:description" content="Working capital on equal terms." />
  <meta name="twitter:image" content="https://paritas.finance/assets/paritas-icon-1000.png" />

  <!-- icons -->
  <link rel="icon" type="image/svg+xml" href="assets/paritas-icon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!-- fonts: Inter 400 + 500 + 600, swap so text paints immediately -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

  <style>
    :root {
      --navy:  #1C3049;
      --greige:#E7E4DC;
      --ink:   #4A4A44;   /* warm ink */

      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--greige);
      color: var(--navy);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: var(--navy); color: var(--greige); }

    .stack {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* --- logo lockup: mark inline, to the left of the wordmark --- */
    .lockup {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* Box reserved to avoid layout shift. Sized to 80% of the wordmark
       x-height match (the solid mark reads heavier than the letterforms,
       so the geometric match looked too large). */
    .mark {
      width: 37px;
      height: 37px;
      flex: none;
      color: var(--navy);
      /* nudge down so the square's bottom sits on the wordmark baseline
         (bottom of the letters "aritas"). position offset, not transform,
         so it does not fight the entrance animation. */
      position: relative;
      top: 5px;
    }
    .mark svg { display: block; width: 100%; height: 100%; }

    /* --- wordmark: lowercase in the source, never transformed --- */
    .wordmark {
      font-weight: 600;
      font-size: 64px;
      line-height: 1;
      letter-spacing: -0.025em;
      color: var(--navy);
    }

    /* --- status badge row --- */
    .meta {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 36px;
    }

    /* Status + invite, all in one clickable box (mailto). */
    .btn {
      font-family: inherit;
      font-weight: 500;
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0.005em;
      color: var(--greige);
      background: var(--navy);
      border: 1px solid var(--navy);
      padding: 11px 18px;
      text-decoration: none;
      transition: background 160ms ease;
    }
    .btn:hover { background: #16283D; }
    .btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }

    /* ============================================================
       Motion: slow, small, staggered. Starts hidden, .ready reveals.
       ============================================================ */
    .mark, .wordmark, .btn { opacity: 0; transform: translateY(12px); }

    .ready .wordmark,
    .ready .btn {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 600ms var(--ease), transform 600ms var(--ease);
    }

    /* the mark slides up as a unit; its two bars carry the fade so the
       "lower bar second" parity nod stays visible */
    .ready .mark {
      opacity: 1;
      transform: translateY(0);
      transition: transform 600ms var(--ease);
    }
    .mark .bar { opacity: 0; }
    .ready .mark .bar { opacity: 1; transition: opacity 600ms var(--ease); }

    /* stagger, 80ms apart, DOM order */
    .ready .mark        { transition-delay: 0ms; }
    .ready .mark .bar-1 { transition-delay: 0ms; }
    .ready .mark .bar-2 { transition-delay: 100ms; }   /* lower bar, 100ms after upper */
    .ready .wordmark    { transition-delay: 80ms; }
    .ready .btn         { transition-delay: 200ms; }

    @media (prefers-reduced-motion: reduce) {
      .mark, .wordmark, .btn, .mark .bar {
        opacity: 1 !important; transform: none !important; transition: none !important;
      }
    }

    /* --- mobile --- */
    @media (max-width: 480px) {
      .lockup { gap: 12px; }
      .mark { width: 24px; height: 24px; top: 3px; }   /* ~76% of the 40px wordmark x-height match */
      .wordmark { font-size: 40px; }
      .meta { flex-direction: column; gap: 18px; margin-top: 30px; }
    }
  </style>
</head>
<body>
  <main class="stack">
    <div class="lockup">
      <div class="mark">
        <svg viewBox="0 0 60 60" role="img" aria-label="paritas">
          <path class="bar bar-1" d="M8 8 H52 V21 Q 30 29 8 34 Z" fill="currentColor" />
          <path class="bar bar-2" d="M52 52 H8 V39 Q 30 31 52 26 Z" fill="currentColor" />
        </svg>
      </div>
      <h1 class="wordmark">paritas</h1>
    </div>

    <div class="meta">
      <a class="btn" href="mailto:ken@paritas.finance">in private beta, get in touch to take part</a>
    </div>
  </main>

  <script>
    // Trigger the staggered entrance after first paint. Only motion logic lives here.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.querySelector('.stack').classList.add('ready');
      });
    });
  </script>
</body>
</html>
